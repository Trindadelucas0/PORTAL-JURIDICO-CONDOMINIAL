# Dev (notebook): docker compose up -d
#   Evolution na porta 8080 do host; Next continua no host (pnpm dev --port 3010).
#   Postgres do app com pgvector: docker compose up -d juricon-postgres-dev (host 5433).
# VPS: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   Next + Postgres Juricon; Evolution sem porta no host; webhook interno.
services:
  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - evolution-redis:/data

  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:-change-me-evolution-only}
      POSTGRES_DB: evolution
    volumes:
      - evolution-pg:/var/lib/postgresql/data
    # Sem porta no host de propósito: não misturar com o Postgres "PORTAL-JURIDICO" do app.

  evolution-api:
    # atendai/evolution-api is gated on Docker Hub; evoapicloud carries the same v2.2.3 tag.
    image: evoapicloud/evolution-api:v2.2.3
    restart: unless-stopped
    depends_on:
      - evolution-redis
      - evolution-postgres
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_APIKEY:-change-me}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD:-change-me-evolution-only}@evolution-postgres:5432/evolution?schema=public
      # Global nesta imagem v2.2.3 NÃO envia WEBHOOK_GLOBAL_HEADERS → 401 + retry infinito.
      # Inbound autenticado: só webhook da instância (ensureInstance / /webhook/set).
      WEBHOOK_GLOBAL_ENABLED: "false"
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # Imagem v2.2.3 traz .env interno 2.3000.1015901307 (desatualizado → socket em loop, QR {count:0}).
      # Valor atual: Baileys Defaults baileys-version.json. Sem isso o dotenv interno prevalece.
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1043857760"
      NODE_OPTIONS: "--require /evolution/patch-os-release.cjs --require /evolution/patch-lid-send.cjs"
      CONFIG_SESSION_PHONE_CLIENT: "Windows"
      CONFIG_SESSION_PHONE_NAME: Chrome
    volumes:
      - ./infra/evolution/patch-os-release.cjs:/evolution/patch-os-release.cjs:ro
      - ./infra/evolution/patch-lid-send.cjs:/evolution/patch-lid-send.cjs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Notebook: o Postgres Windows em 5432 não tem a extensão vector.
  # Next/worker no host usam JURICON_POSTGRES_HOST_PORT (padrão 5433).
  # POSTGRES_PASSWORD / DB_PASSWORD só valem na primeira criação do volume
  # juricon-pg-dev; mudar o .env depois não troca a senha do cluster — use
  # ALTER USER no container (peer auth) ou alinhe DATABASE_URL à senha já gravada.
  # Se outro container já publicou 5433, este serviço sobe sem porta no host e o
  # next dev autenticará no banco errado (P1000). Pare o outro ou mude a porta.
  # VPS não sobe este serviço (nome diferente de juricon-postgres no prod).
  juricon-postgres-dev:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    ports:
      - "${JURICON_POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-PORTAL-JURIDICO}
    volumes:
      - juricon-pg-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PORTAL-JURIDICO"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Broker de jobs do Juricon. Não é cache da inbox e não é o Redis da Evolution.
  # Sem porta publicada no host.
  juricon-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${JURICON_REDIS_PASSWORD:-change-me-juricon-redis}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""

volumes:
  evolution-redis:
  evolution-pg:
  juricon-pg-dev:
