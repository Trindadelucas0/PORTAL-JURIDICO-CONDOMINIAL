services:
  juricon-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: juricon
      POSTGRES_PASSWORD: ${JURICON_POSTGRES_PASSWORD:?defina JURICON_POSTGRES_PASSWORD}
      POSTGRES_DB: PORTAL-JURIDICO
    volumes:
      - juricon-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juricon -d PORTAL-JURIDICO"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem 5432 no host. Dump: docker compose exec juricon-postgres pg_dump ...

  juricon-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      juricon-postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started
    ports:
      - "127.0.0.1:${JURICON_HOST_PORT:-3010}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://juricon:${JURICON_POSTGRES_PASSWORD}@juricon-postgres:5432/PORTAL-JURIDICO?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?defina APP_PUBLIC_URL}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_APIKEY: ${EVOLUTION_APIKEY:?defina EVOLUTION_APIKEY}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:?defina EVOLUTION_WEBHOOK_SECRET}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-juricon}
      EVOLUTION_WEBHOOK_URL: http://juricon-app:3000/api/webhooks/evolution
    volumes:
      - juricon-uploads:/app/uploads

  evolution-api:
    ports: !reset []
    extra_hosts: !reset []
    environment:
      SERVER_URL: http://evolution-api:8080
    mem_limit: 1536m

volumes:
  juricon-pg:
  juricon-uploads:
